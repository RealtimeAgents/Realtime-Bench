[project]
name = "streaming-agent-eval"
version = "0.1.0"
description = "Realtime-Bench framework for evaluating multimodal models on interactive tasks"
requires-python = ">=3.12"
dependencies = [
    "harbor==0.23.0",
    # Validated together: raw provider usage auditing and native Realtime serialization.
    "openai[realtime]==2.54.0",
    "litellm==1.106.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "requests>=2.31",
    "websockets>=11.0",
    "uptime-kuma-api",
    "Flask==3.1.1",
    "google-genai>=2.22.0",
]

[project.scripts]
rtbench = "realtime_framework.evaluation.harbor_cli:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["realtime_framework*", "realtime_tasks*"]

# Released harness identity; refresh hash from `uv run rtbench suites` when releasing.
# A checkout whose framework sources or runtime dependencies differ reports "<version>+dev".
[tool.rtbench.harness]
version = "1.0"
hash = "f582f3da4ca20803e75d9036b1bd7fe3b0b6766741ed9a148915f8acc796c7ca"

[tool.ruff]
line-length = 100
target-version = "py312"

# Framework code reads the time and waits only through the episode clocks
# (realtime_framework/clock.py), so a fake clock can run an episode. tests/test_clock_lint.py
# runs this rule, and also finds loop.time(), which ruff cannot resolve.
[tool.ruff.lint]
extend-select = ["TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"time.time".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.time_ns".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.monotonic".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.monotonic_ns".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.perf_counter".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.perf_counter_ns".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"datetime.datetime.now".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"datetime.datetime.utcnow".msg = "read the time from the episode clock (realtime_framework/clock.py)"
"time.sleep".msg = "wait with Clock.sleep"
"threading.Timer".msg = "start timers with Clock.timer"
"asyncio.sleep".msg = "wait with Clock.sleep_async"
"asyncio.wait_for".msg = "bound waits with Clock.wait_for"
"asyncio.timeout".msg = "bound waits with Clock.wait_for"
"asyncio.timeout_at".msg = "bound waits with Clock.wait_for"
"asyncio.new_event_loop".msg = "make loops with Clock.new_event_loop, so loop.time() is the clock's"
"asyncio.run".msg = "make loops with Clock.new_event_loop, so loop.time() is the clock's"

[tool.ruff.lint.per-file-ignores]
# The clock module makes these calls for everyone else.
"realtime_framework/clock.py" = ["TID251"]
# Task code does not change in phase 2; its time reads are listed in the clock report.
"realtime_tasks/**" = ["TID251"]
# Tests wait in real time where they mean to, and tests/fake_clock.py implements the fake clock.
"tests/**" = ["TID251"]
# Outside an episode or outside the runner process: image and container setup, the guest server
# inside the sandbox, Harbor trials and results, and submission.
"realtime_framework/sandbox/apptainer.py" = ["TID251"]
"realtime_framework/sandbox/desktop.py" = ["TID251"]
"realtime_framework/sandbox/guest_server/server.py" = ["TID251"]
"realtime_framework/evaluation/_trial.py" = ["TID251"]
"realtime_framework/evaluation/harbor.py" = ["TID251"]
"realtime_framework/evaluation/harbor_results.py" = ["TID251"]
"realtime_framework/evaluation/submission.py" = ["TID251"]
# The browser clock's frame waits (cdp_advance_rendered_frame, cdp_sync_realtime_frame), which the
# task runtimes call (realtime_tasks/game/runtime.py, realtime_tasks/web/runtime.py) without an
# episode clock.
"realtime_framework/sandbox/browser/clock.py" = ["TID251"]
# Records only: trace, pack and report timestamps, and the trace writer's GIL yields.
"realtime_framework/evaluation/agent_trace.py" = ["TID251"]
"realtime_framework/evaluation/reporting.py" = ["TID251"]
# Replaces time.sleep while it runs runner main() up to the loop to export the configuration.
"realtime_framework/evaluation/effective_config.py" = ["TID251"]

[tool.setuptools.package-data]
"realtime_tasks" = ["**/*"]
"realtime_framework.sandbox" = ["images/**/*", "guest_server/requirements.txt"]
"realtime_framework.evaluation" = ["viewer/*.js"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
