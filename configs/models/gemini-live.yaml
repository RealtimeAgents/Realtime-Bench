endpoint:
  api: gemini_live
  model: gemini-3.1-flash-live-preview
  api_key_env: GEMINI_API_KEY
reasoning_effort: low
# 3.1 Flash Live has no asynchronous function calling: a call blocks until its response, and
# response scheduling does not apply.
provider_options:
  tool_behavior: blocking
  completion_signal: turn_complete
  input_transport: client_content
  tool_response_scheduling: omit
  history_format: tool_transcript
