schema_version = "1.4"

[agent]
timeout_sec = 900

[verifier]
timeout_sec = 120

[environment]
build_timeout_sec = 600
network_mode = "public"

[metadata]
task_id = "gh_timed_chess"
category = "browser_game"
game_key = "01_timed-chess"
tier = "01_01"
idx = 0
score_field = "game_state.captures"
target = 4
http_port = 8940
dbg_port = 9240
player_mode = "single"
source = "sagarbudhwani/classic-chess-js @ 28f90f911db2d3638ff064795d67a87f1142b98b"
keys = []
rules = '''
Click a White piece, then one of its highlighted destination squares; Black replies automatically after each of your moves. Your clock runs only on your turn. Only captures made by White count, and each one shows an x in the move list; a pawn capture that promotes to a queen is shown without an x and does not count. The game ends at checkmate, stalemate or when either clock reaches zero, so a checkmate before your fourth capture ends the game without success. Moves cannot be undone and the game cannot be restarted.'''
description = "Play pinned open-source timed chess against an AI and capture at least four Black pieces before the irreversible two-minute White clock expires. Success is measured when `game_state.captures` reaches 4."
instruction = "instruction.md"
evaluation = "tests/evaluation.py"
entry = "environment/index.html"

[metadata.interactables]
schema_version = 1
task_id = "gh_timed_chess"

[[metadata.interactables.elements]]
selector = ".square"
id_template = "chess-square-{data-row}-{data-col}"
label_template = "Chess square row {data-row} column {data-col}"
role = "gridcell"
actions = ["click"]
