rules = '''
Click anywhere in the room to cast a green skull toward that point; the small reticle beside
Norman shows the aim. Skulls fall under gravity and vanish when they touch the floor, so a level
shot only reaches villagers within about a fifth of the room -- aim higher to lob at distant
ones. Norman holds 3 casts and regains one per second. A villager killed by a skull, by a
skeleton, or by walking into Norman is worth 5 souls (more while every recent cast has hit),
but each villager that reaches Norman costs him a heart out of 5, tougher enemies cost more, and
when the hearts run out the game ends. Space resurrects every corpse on the floor into a
skeleton that marches right and kills one villager; the ability recharges over 10 seconds (bar at
the bottom). Between levels a Rituals shop opens: ArrowUp/ArrowDown choose, Enter buys (spending
lowers the soul counter) and Continue starts the next level. Reach
`game_state.souls_collected >= 200`.'''
description = "Aim gravity-arced spells and time resurrection across bunched enemy waves to bring the soul counter to 200."
