rules = '''
Hold Q to move the left paddle up and A to move it down; release the key to stop. The ball
has no continuous acceleration and takes about 8 seconds to cross the court horizontally;
it bounces off the top and bottom walls, and the computer controls the right paddle.

After the normal collision reflection, a paddle's active movement direction modifies the
ball's vertical velocity: multiply it by 0.5 when the directions match, or by 1.5 when they
oppose. This applies to both paddles. The multiplier itself does not reverse the vertical
direction or change horizontal velocity. With neither movement direction active, no
multiplier is applied. For your paddle, holding Q or A keeps that direction active even
when the paddle is blocked by the court boundary. If both keys are held, the paddle stops
moving but Q takes priority for this multiplier.

Every rebound off your paddle
counts as one return. A ball that passes your paddle is an irreversible point for the
computer. The benchmark ends in failure when the computer reaches 3 points and succeeds when
your return count reaches 6.'''
description = "Return the ball six times in pinned open-source JavaScript Pong before the computer scores three. The benchmark launch page sets an approximately 8 s horizontal court crossing with no continuous rally acceleration (upstream defaults are 4 s and 8 px/s^2), while preserving native paddle spin: after collision reflection, an active paddle direction multiplies vertical velocity by 0.5 when aligned with the ball's vertical direction or 1.5 when opposed. The ball and the computer paddle keep moving during reasoning, and every ball that passes the left paddle is an irreversible point; `game_state.player_returns` (read-only count of rebounds off the left paddle) must reach 6 before the computer reaches 3."
